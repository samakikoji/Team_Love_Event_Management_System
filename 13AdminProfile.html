<!DOCTYPE html>
<html>
<head>
    <title>Admin Profile</title>
    <style>
        body{font-family:Arial;color:#D93668;background:#FFFFFF;margin:30px}
        input{display:block;padding:10px;margin:10px 0;width:300px}
        button{background:#D93668;color:#FFFFFF;border:0;padding:10px;margin:5px;cursor:pointer}
    </style>
</head>
<body>
    <h1>Admin Profile</h1>
    <a href="6AdminDashboard.html">Back to Dashboard</a>
    <form onsubmit="saveProfile(event)">
        <input id="name" placeholder="Admin Name" required>
        <input id="email" type="email" placeholder="Admin Email" required>
        <button type="submit">Save Changes</button>
        <button type="button" onclick="editProfile()">Edit Profile</button>
        <button type="button" onclick="logout()">Logout</button>
    </form>
    <p id="message"></p>
    <script>
        var user=JSON.parse(localStorage.getItem("tle_currentUser")||"null");
        var profile=JSON.parse(localStorage.getItem("tle_admin_profile")||"null");
        document.getElementById("name").value=profile?.name||(user&&user.name)||"Admin";
        document.getElementById("email").value=profile?.email||(user&&user.email)||"admin@teamlove.com";
        function editProfile(){
            document.getElementById("name").disabled=false;
            document.getElementById("email").disabled=false;
            document.getElementById("message").innerHTML="You can now edit your profile.";
        }
        function saveProfile(event){
            event.preventDefault();
            var p={
                name:document.getElementById("name").value,
                email:document.getElementById("email").value
            };
            localStorage.setItem("tle_admin_profile",JSON.stringify(p));
            document.getElementById("message").innerHTML="Admin profile saved.";
        }
        function logout(){
            localStorage.removeItem("tle_currentUser");
            window.location.href="WelcomePage.html";
        }
    </script>
</body>
</html>
