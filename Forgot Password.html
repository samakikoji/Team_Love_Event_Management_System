
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body{font-family:Arial;background:#FFFFFF;color:#D93668;margin:40px}
        input{padding:10px;margin:8px 0;width:280px}
        button{background:#D93668;color:#FFFFFF;border:0;padding:10px 20px;margin:5px;cursor:pointer}
    </style>
</head>
<body>
    <h1>♥ Team Love Events</h1>
    <h2>Forgot Password?</h2>

    <p>Enter your registered email and your new password.</p>

    <form onsubmit="resetPassword(event)">
        <input type="email" id="email" placeholder="Registered Email" required><br>
        <input type="password" id="newPassword" placeholder="New Password" required><br>
        <input type="password" id="confirmPassword" placeholder="Confirm New Password" required><br>

        <button type="submit">Reset Password</button>
        <button type="button" onclick="window.location.href='3ClientLog-in.html'">Back to Login</button>
    </form>

    <p id="message"></p>

    <script>
        function resetPassword(event){
            event.preventDefault();

            var email=document.getElementById("email").value.trim().toLowerCase();
            var newPassword=document.getElementById("newPassword").value;
            var confirmPassword=document.getElementById("confirmPassword").value;

            var saved=localStorage.getItem("tle_accounts");
            var accounts=saved?JSON.parse(saved):[];

            var user=accounts.find(a=>
                a.email.toLowerCase()===email && a.role==="Client"
            );

            if(!user){
                document.getElementById("message").innerHTML=
                    "Client account not found. Check your registered email.";
                return;
            }

            if(newPassword!==confirmPassword){
                document.getElementById("message").innerHTML=
                    "Passwords do not match.";
                return;
            }

            user.password=newPassword;

            localStorage.setItem("tle_accounts",JSON.stringify(accounts));

            document.getElementById("message").innerHTML=
                "Password changed successfully! You can now log in.";

            document.querySelector("form").reset();
        }
    </script>
</body>
</html>
