<!DOCTYPE html>
<html>
<head>
    <title>Client Profile</title>
    <style>
        body{font-family:Arial;color:#D93668;background:#FFFFFF;margin:30px}
        input{display:block;padding:10px;margin:10px 0;width:300px}
        button{background:#D93668;color:#FFFFFF;border:0;padding:10px;margin:5px;cursor:pointer}
    </style>
</head>
<body>
    <h1>Client Profile</h1><br><br>
    <h1>Personal Information</h1>
    <form onsubmit="saveProfile(event)">
        <input id="name" placeholder="Name" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="contact" placeholder="Contact Number">
        <input id="address" placeholder="Address">
        <button type="submit">Save Changes</button>
        <button type="button" onclick="editProfile()">Edit Profile</button>
        <button type="button" onclick="logout()">Logout</button>
    </form>
    <p id="message"></p>
    <script>
        var user=JSON.parse(localStorage.getItem("tle_currentUser")||"null");
        var profile=JSON.parse(localStorage.getItem("tle_client_profile")||"null");
        if(user){
            document.getElementById("name").value=profile?.name||user.name||"";
            document.getElementById("email").value=profile?.email||user.email||"";
            document.getElementById("contact").value=profile?.contact||user.contact||"";
            document.getElementById("address").value=profile?.address||user.address||"";
        }
        function editProfile(){
            document.querySelectorAll("input").forEach(x=>x.disabled=false);
            document.getElementById("message").innerHTML="You can now edit your profile.";
        }
        function saveProfile(event){
            event.preventDefault();
            var p={
                name:document.getElementById("name").value,
                email:document.getElementById("email").value,
                contact:document.getElementById("contact").value,
                address:document.getElementById("address").value
            };
            localStorage.setItem("tle_client_profile",JSON.stringify(p));
            if(user&&p.email===user.email){
                user.name=p.name;user.contact=p.contact;user.address=p.address;
                localStorage.setItem("tle_currentUser",JSON.stringify(user));
            }
            document.getElementById("message").innerHTML="Profile saved.";
        }
        function logout(){localStorage.removeItem("tle_currentUser");location.href="WelcomePage.html";}
    </script>
</body>
</html>
