<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body{font-family:Arial;color:#D93668;background:#FFFFFF;margin:0}
        nav{padding:20px;border-bottom:2px solid #D93668}
        nav a{color:#D93668;margin:8px}
        main{padding:25px}
        .card{display:inline-block;border:1px solid #D93668;padding:20px;margin:10px;min-width:130px}
        button{background:#D93668;color:#FFFFFF;border:0;padding:10px;cursor:pointer}
    </style>
</head>
<body>
<nav>
    <b>Team Love Events - Admin</b><br><br>
    <a href="6AdminDashboard.html">Dashboard</a>
    <a href="7EventManagement.html">Events</a>
    <a href="8BookingManagement.html">Bookings</a>
    <a href="9PaymentManagement.html">Payments</a>
    <a href="10Notifications.html">Notifications</a>
    <a href="11EventRecords.html">Event Records</a>
    <a href="13AdminProfile.html">Profile</a>
    <button onclick="logout()">Logout</button>
</nav>
<main>
    <h1>Admin Dashboard</h1>
    <div class="card">Total Events<h2 id="events">0</h2></div>
    <div class="card">Total Bookings<h2 id="bookings">0</h2></div>
    <div class="card">Pending Bookings<h2 id="pending">0</h2></div>
    <div class="card">Confirmed Bookings<h2 id="confirmed">0</h2></div>
    <div class="card">Total Clients<h2 id="clients">0</h2></div>
    <h2>Recent Bookings</h2>
    <table border="1" cellpadding="10">
        <thead><tr><th>Client</th><th>Event</th><th>Date</th><th>Status</th></tr></thead>
        <tbody id="recent"></tbody>
    </table>
</main>
<script>
    var events=JSON.parse(localStorage.getItem("tle_events")||"[]");
    var bookings=JSON.parse(localStorage.getItem("tle_bookings")||"[]");
    var accounts=JSON.parse(localStorage.getItem("tle_accounts")||"[]");
    document.getElementById("events").innerHTML=events.length;
    document.getElementById("bookings").innerHTML=bookings.length;
    document.getElementById("pending").innerHTML=bookings.filter(b=>b.status==="Pending").length;
    document.getElementById("confirmed").innerHTML=bookings.filter(b=>b.status==="Confirmed").length;
    document.getElementById("clients").innerHTML=accounts.filter(a=>a.role==="Client").length;
    document.getElementById("recent").innerHTML=bookings.slice(-5).reverse().map(b=>
        "<tr><td>"+b.clientName+"</td><td>"+b.event+"</td><td>"+b.date+"</td><td>"+b.status+"</td></tr>"
    ).join("");
    function logout(){localStorage.removeItem("tle_currentUser");location.href="index.html";}
</script>
</body>
</html>
