<!DOCTYPE html>
<html>
<head>
    <title>Event Records</title>
    <style>
        body{font-family:Arial;color:#D93668;background:#FFFFFF;margin:25px}
        input{padding:10px;margin:10px 0}
        th,td{padding:10px}
    </style>
</head>
<body>
    <h1>Event Records</h1>
    <a href="6AdminDashboard.html">Back to Dashboard</a>
    <p>Search past and current event bookings.</p>
    <input id="search" placeholder="Search event, client, or venue" oninput="displayRecords()">
    <table border="1">
        <thead><tr><th>Event Name</th><th>Client</th><th>Date</th><th>Venue</th><th>Final Cost</th><th>Status</th></tr></thead>
        <tbody id="table"></tbody>
    </table>
    <script>
        function displayRecords(){
            var bookings=JSON.parse(localStorage.getItem("tle_bookings")||"[]");
            var q=document.getElementById("search").value.toLowerCase();
            var rows=bookings.filter(b=>
                (b.event+" "+b.clientName+" "+b.venue).toLowerCase().includes(q)
            );
            document.getElementById("table").innerHTML=rows.map(b=>
                "<tr><td>"+b.event+"</td><td>"+b.clientName+"</td><td>"+b.date+
                "</td><td>"+b.venue+"</td><td>₱"+b.price+"</td><td>"+b.status+"</td></tr>"
            ).join("");
        }
        displayRecords();
    </script>
</body>
</html>
